services:
  # ── Backend: Node.js Express ───────────────────────────────────────────────
  - type: web
    name: pawtrack-backend
    env: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — no need to hard-code it.
      # server.js already reads process.env.PORT || 4000, so this just works.

      - key: SESSION_SECRET
        generateValue: true

      # FRONTEND_URL: the Render frontend origin added to the CORS allowlist.
      # server.js also hardcodes this origin as a safety net, but setting it
      # here too keeps the configuration self-documenting and lets you override
      # it for custom domains without touching code.
      - key: FRONTEND_URL
        value: "https://pawtrack-frontend.onrender.com"

      # ── MySQL / PlanetScale (or other hosted MySQL) ──────────────────────
      # All four must be set in the Render dashboard after provisioning the DB.
      # Never put real credentials here — this file is committed to Git.
      - key: DB_HOST
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: ""

      # Set DB_SSL=true when connecting to PlanetScale, Aiven, or any provider
      # that requires TLS. Leave blank or omit for local dev / providers that
      # don't need it. db.js reads this variable.
      - key: DB_SSL
        value: ""

  # ── Frontend: Static Site ──────────────────────────────────────────────────
  - type: web
    name: pawtrack-frontend
    env: static
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    envVars:
      # VITE_API_BASE_URL must include the /api prefix so the frontend
      # Axios client (api.js) sends requests to the correct backend path.
      # Render's fromService.url gives just the root URL of the backend
      # service — we append /api here.
      # VITE_API_BASE_URL: injected at build time so every image URL and API
      # call in the production bundle points to the correct backend service.
      # Must include the /api suffix because api.js uses it as the axios baseURL
      # and imageUrl.js strips /api to derive the bare backend origin.
      - key: VITE_API_BASE_URL
        value: "https://pawtrack-backend-6n0t.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
