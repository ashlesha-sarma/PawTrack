services:
  # ── Backend: Node.js Express (also serves the built React frontend) ─────────
  - type: web
    name: pawtrack-backend
    env: node
    plan: free
    region: ohio
    rootDir: backend
    # Build the React app first so Express can serve it from ../frontend/dist.
    # VITE_API_BASE_URL=/api so the bundle uses relative URLs that hit Express
    # directly — no cross-origin requests, no cookie issues.
    buildCommand: "npm install && cd ../frontend && npm install && VITE_API_BASE_URL=/api npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — no need to hard-code it.

      - key: SESSION_SECRET
        generateValue: true

      # FRONTEND_URL: still listed for CORS (covers the old frontend service
      # URL and any local dev origin). Having it set does no harm now that
      # frontend and API share one origin.
      - key: FRONTEND_URL
        value: "https://pawtrack-frontend.onrender.com"

      # ── MySQL / PlanetScale (or other hosted MySQL) ──────────────────────
      # All four must be set in the Render dashboard after provisioning the DB.
      - key: DB_HOST
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: ""

      # Set DB_SSL=true when connecting to PlanetScale, Aiven, or any provider
      # that requires TLS. Leave blank or omit for local dev / providers that
      # don't need it. db.js reads this variable.
      - key: DB_SSL
        value: ""

  # ── Frontend static service (OPTIONAL — kept so old links still work) ───────
  # The real app is now served by the backend service above.
  # If you want to retire this, delete it from the Render dashboard.
  - type: web
    name: pawtrack-frontend
    env: static
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "/api"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pawtrack-backend-6n0t.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://pawtrack-backend-6n0t.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
