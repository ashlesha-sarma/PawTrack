services:
  # ── Backend: Node.js Express ───────────────────────────────────────────────
  - type: web
    name: pawtrack-backend
    env: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — no need to hard-code it.
      # server.js already reads process.env.PORT || 4000, so this just works.

      - key: SESSION_SECRET
        generateValue: true

      # FRONTEND_URL: the Render frontend origin added to the CORS allowlist.
      # server.js also hardcodes this origin as a safety net, but setting it
      # here too keeps the configuration self-documenting and lets you override
      # it for custom domains without touching code.
      - key: FRONTEND_URL
        value: "https://pawtrack-frontend.onrender.com"

      # ── MySQL / PlanetScale (or other hosted MySQL) ──────────────────────
      # All four must be set in the Render dashboard after provisioning the DB.
      # Never put real credentials here — this file is committed to Git.
      - key: DB_HOST
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: ""

      # Set DB_SSL=true when connecting to PlanetScale, Aiven, or any provider
      # that requires TLS. Leave blank or omit for local dev / providers that
      # don't need it. db.js reads this variable.
      - key: DB_SSL
        value: ""

  # ── Frontend: Static Site ──────────────────────────────────────────────────
  - type: web
    name: pawtrack-frontend
    env: static
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    envVars:
      # Use a relative /api path so the browser sends API requests to the
      # SAME origin as the frontend (same-origin cookies, no SameSite issues).
      # Render's proxy route below forwards /api/* to the real backend.
      - key: VITE_API_BASE_URL
        value: "/api"
    routes:
      # Proxy /api/* and /uploads/* to the backend on the SAME origin so
      # session cookies are treated as first-party and always sent.
      - type: proxy
        source: /api/*
        destination: https://pawtrack-backend-6n0t.onrender.com/api/*
      - type: proxy
        source: /uploads/*
        destination: https://pawtrack-backend-6n0t.onrender.com/uploads/*
      # SPA catch-all — must come AFTER the proxy routes.
      - type: rewrite
        source: /*
        destination: /index.html
